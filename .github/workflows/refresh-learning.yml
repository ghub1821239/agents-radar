name: Refresh Personalized Learning

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest reports
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate personalized learning card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'qwen' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DIGEST_REPO: ${{ github.repository }}
          PROFILE_GITHUB_USER: ${{ vars.PROFILE_GITHUB_USER || github.repository_owner }}
        run: pnpm learning

      - name: Update site manifest and RSS
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm manifest

      - name: Commit learning card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          git add "digests/$DATE/ai-learning.md" "digests/$DATE/learning.json" manifest.json feed.xml
          if git diff --cached --quiet; then
            echo "Learning card is already up to date"
          else
            git commit -m "learning: ${DATE} personalized card"
            git pull --rebase
            git push
          fi

      - name: Send learning card to Feishu
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm notify:feishu

  pages:
    needs: learning
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout generated reports
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html manifest.json feed.xml .nojekyll _site/
          cp -R assets digests _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
